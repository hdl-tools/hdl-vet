name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls this one.
  workflow_call:

permissions:
  contents: read

# In a called workflow, github.workflow is the name of the caller. So a release run
# has its own group (ci-release-...), and a push or a pull request never cancels it.
# The release run never cancels itself: only a run of the workflow `ci` is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' }}

env:
  # The regeneration corpus is built from this hdl-bag commit. Bump it deliberately:
  # tests/core/test_corpus.py pins numbers measured on it.
  HDL_BAG_REF: 0b88a6bae969abccaa31069549e0c4166e663b00
  UV_VERSION: "0.9.26"

jobs:
  # Fast checks that need no corpus: lint, types, and the rules of the code base.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group dev
      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github
      - name: Format
        run: uv run --no-sync ruff format --check --diff
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Project rules
        run: uv run --no-sync pytest -q tests/docs/test_project_rules.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The proofs on the large generated design (marker `bigproof`) take minutes and
          # gigabytes. One job runs them; the others run every other test.
          - { os: ubuntu-24.04, python: "3.11", select: "not bigproof" }
          - { os: ubuntu-24.04, python: "3.13", select: "bigproof or not bigproof" }
          - { os: windows-2022, python: "3.11", select: "not bigproof" }
          - { os: windows-2022, python: "3.13", select: "not bigproof" }
          # macOS is the only runner whose file system ignores case while `resolve()`
          # leaves a name that is not the one on disk alone. Several tests can only run
          # there, and skip with a reason elsewhere. One job, not two: what those tests
          # depend on is the file system, not the version of Python, and both versions
          # are covered on Linux and on Windows. `pyslang` is one abi3 wheel for both.
          - { os: macos-15, python: "3.13", select: "not bigproof" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: hdl-tools/hdl-bag
          ref: ${{ env.HDL_BAG_REF }}
          path: .hdl-bag
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[equiv]" "pytest>=8" ./.hdl-bag
      - name: Test (corpus and Yosys required)
        shell: bash
        env:
          HDL_VET_REQUIRE_CORPUS: "1"
          HDL_VET_REQUIRE_EQUIV: "1"
          HDL_BAG_REPO: ${{ github.workspace }}/.hdl-bag
          SELECT: ${{ matrix.select }}
        run: uv run --no-sync pytest -q -m "$SELECT"

  # The suite runs against an editable install; this builds the wheel, installs it
  # alone into a fresh environment, and runs `vet` from there.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Build the wheel
        shell: bash
        run: uv build --wheel --out-dir dist
      - name: Install the wheel alone
        shell: bash
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv dist/*.whl
      - name: Smoke check
        shell: bash
        run: |
          if [ -x .wheel-venv/bin/python ]; then PY=.wheel-venv/bin/python; else PY=.wheel-venv/Scripts/python.exe; fi
          "$PY" tests/smoke_wheel.py
