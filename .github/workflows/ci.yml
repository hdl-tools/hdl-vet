name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The regeneration corpus is built from this hdl-bag commit. Bump it deliberately:
  # tests/test_corpus.py pins numbers measured on it.
  HDL_BAG_REF: 930fe2dc10d94d789d0ce0f5ee01b9b91bce5d64
  UV_VERSION: "0.9.26"

jobs:
  # Fast checks that need no corpus: lint, types, and the rules of the code base.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group dev
      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github
      - name: Format
        run: uv run --no-sync ruff format --check --diff
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Project rules
        run: uv run --no-sync pytest -q tests/test_project_rules.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-2022, python: "3.11" }
          - { os: windows-2022, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hdl-tools/hdl-bag
          ref: ${{ env.HDL_BAG_REF }}
          path: .hdl-bag
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          uv venv
          uv pip install -e . "pytest>=8" ./.hdl-bag
      - name: Test (corpus required)
        shell: bash
        env:
          HDL_VET_REQUIRE_CORPUS: "1"
          HDL_BAG_REPO: ${{ github.workspace }}/.hdl-bag
        run: uv run --no-sync pytest -q

  # The suite runs against an editable install; this builds the wheel, installs it
  # alone into a fresh environment, and runs `vet` from there.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Build the wheel
        shell: bash
        run: uv build --wheel --out-dir dist
      - name: Install the wheel alone
        shell: bash
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv dist/*.whl
      - name: Smoke check
        shell: bash
        run: |
          if [ -x .wheel-venv/bin/python ]; then PY=.wheel-venv/bin/python; else PY=.wheel-venv/Scripts/python.exe; fi
          "$PY" tests/smoke_wheel.py
